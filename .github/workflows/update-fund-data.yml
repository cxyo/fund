name: Update Fund Data

on:
  workflow_dispatch:  # 允许手动触发
    inputs:
      days:
        description: 'Number of days to fetch'
        required: true
        default: '180'

permissions:
  contents: write  # 给予写入内容的权限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 确保获取完整的git历史

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch fund net value data
        run: |
          # 创建一个简单的Node.js脚本用于爬取数据
          cat > fetch-fund-data.js << 'EOF'
