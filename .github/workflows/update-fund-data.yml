          const FUND_CODES_MAP = {
            // 这里保留原来的基金代码映射
          };
          
          // 其余脚本内容保持不变
          EOF
          
          # 运行脚本
          node fetch-fund-data.js ${{ github.event.inputs.days }}

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data/
          git commit -m 'Update fund net value data'
          git push
